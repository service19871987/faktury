<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Generator Faktur</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; }
        input, select { padding: 5px; width: 200px; }
        button { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; margin-right: 10px; }
        .section { margin-bottom: 30px; border: 1px solid #ccc; padding: 15px; }
        #status { margin-top: 10px; color: green; }
        #error { color: red; }
        #invoicePreview { padding: 10mm; margin-top: 20px; display: none; font-size: 9px; width: 190mm; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 2px; text-align: left; }
        th { background: #f0f0f0; }
        .right { text-align: right; }
        .signature-line { border-bottom: 1px solid black; height: 20px; margin-top: 5px; }
        .summary-table td { border: none; padding: 0; }
        .bold-text { font-weight: bold; }
        #itemsTable input, #itemsTable select { border: none; background: transparent; }
        #itemsTable th, #itemsTable td { border: 1px solid #ccc; padding: 5px; }
        #carDataSection { display: none; }
    </style>
</head>
<body>
    <h2>Generator Faktur</h2>

    <div class="section" id="invoiceSection">
        <h3>Generowanie faktury</h3>

        <!-- ВИБІР ПОСЛУГИ -->
        <div class="form-group">
            <label for="serviceType">Rodzaj usługi:</label>
            <select id="serviceType" onchange="toggleServiceType()">
                <option value="">Wybierz...</option>
                <option value="Usługa mechanika">Usługa mechanika</option>
                <option value="Naprawa pojazdu">Naprawa pojazdu</option>
                <option value="Auto">Auto</option>
            </select>
        </div>

        <!-- ДАНІ АВТО (показуються тільки при виборі Auto) -->
        <div id="carDataSection">
            <div class="form-group">
                <label for="carBrand">Marka auta:</label>
                <input type="text" id="carBrand" placeholder="Np. KIA">
            </div>
            <div class="form-group">
                <label for="carModel">Model auta:</label>
                <input type="text" id="carModel" placeholder="Np. RIO">
            </div>
            <div class="form-group">
                <label for="regNumber">Nr rejestracyjny:</label>
                <input type="text" id="regNumber" placeholder="Np. PZ332YK">
            </div>
        </div>

        <div class="section">
            <h4>Pozycje faktury</h4>
            <table id="itemsTable">
                <thead>
                    <tr>
                        <th>Nazwa</th>
                        <th>Ref. faktura (opcjonalnie)</th>
                        <th>Ilość</th>
                        <th>J.m.</th>
                        <th>Cena netto (PLN)</th>
                        <th>Wartość netto (PLN)</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="itemsTbody">
                    <tr>
                        <td><input type="text" class="item-name" value="" style="width:100%;"></td>
                        <td><input type="text" class="item-ref" placeholder="Np. 5/10/2024" style="width:100px;"></td>
                        <td><input type="number" class="item-qty" value="1" min="1" style="width:60px;"></td>
                        <td><select class="item-unit" style="width:60px;"><option>szt.</option><option>godz.</option></select></td>
                        <td><input type="number" class="item-price" step="0.01" value="500.00" style="width:80px;"></td>
                        <td class="item-total" style="text-align:right; font-weight:bold;">500.00</td>
                        <td><button type="button" onclick="removeItem(this)">Usuń</button></td>
                    </tr>
                </tbody>
            </table>
            <button type="button" onclick="addItemRow()">Dodaj pozycję</button>
            <div style="margin-top:10px; font-weight:bold;">Suma netto: <span id="grandTotal">500.00</span> PLN</div>
        </div>

        <div class="form-group">
            <label for="paymentType">Format płatności:</label>
            <select id="paymentType" onchange="updateDisable()" required>
                <option value="">Wybierz...</option>
                <option value="Gotówka">Gotówka</option>
                <option value="Przelew">Przelew</option>
            </select>
        </div>
        <div class="form-group">
            <label for="issueDate">Data wystawienia (opcjonalnie):</label>
            <input type="date" id="issueDate">
        </div>
        <div class="form-group">
            <label for="buyerType">Typ nabywcy:</label>
            <select id="buyerType" onchange="toggleBuyerType()">
                <option value="firma">Firma (NIP)</option>
                <option value="prywatna">Osoba prywatna (PESEL)</option>
            </select>
        </div>
        <div class="form-group" id="nipGroup">
            <label for="buyerNip">NIP Nabywcy:</label>
            <input type="text" id="buyerNip" placeholder="Np. 7773448315" oninput="loadClientData()">
        </div>
        <div class="form-group" id="peselGroup" style="display:none;">
            <label for="buyerPesel">PESEL:</label>
            <input type="text" id="buyerPesel" placeholder="Np. 12345678901">
        </div>
        <div id="buyerManual" style="display: none;">
            <div class="form-group">
                <label for="buyerName">Nazwa / Imię i nazwisko:</label>
                <input type="text" id="buyerName" placeholder="Np. Liubomyr Shatruk LS_CAR">
            </div>
            <div class="form-group">
                <label for="buyerAddress">Adres / Ulica:</label>
                <input type="text" id="buyerAddress" placeholder="Np. os. Hipolita Cegielskiego 14/21">
            </div>
            <div class="form-group">
                <label for="buyerZipCity">Kod pocztowy / Miasto:</label>
                <input type="text" id="buyerZipCity" placeholder="Np. 62-020 Swarzędz">
            </div>
            <button onclick="saveClientData()">Zapisz klienta do bazy</button>
        </div>
        <div class="form-group">
            <label for="customNumber">Niestandardowy numer faktury (opcjonalnie, N/MM/RRRR):</label>
            <input type="text" id="customNumber" placeholder="Np. 1/10/2024" maxlength="10" oninput="formatInvoiceNumber(this)">
        </div>
        <button onclick="generateInvoice()">Wygeneruj fakturę</button>
        <div id="status"></div>
        <div id="error"></div>
    </div>
    <div id="invoicePreview"></div>

    <script>
        function getInvoiceCounter(month, year) {
            const key = `invoiceCounter_${month}_${year}`;
            return localStorage.getItem(key) ? parseInt(localStorage.getItem(key)) : 1;
        }

        function setInvoiceCounter(counter, month, year) {
            const key = `invoiceCounter_${month}_${year}`;
            localStorage.setItem(key, counter);
        }

        function formatInvoiceNumber(input) {
            let value = input.value.replace(/\D/g, '');
            let formatted = '';
            if (value.length > 0) {
                formatted = value.substring(0, 2);
                if (value.length > 2) {
                    formatted += '/' + value.substring(2, 4);
                    if (value.length > 4) {
                        formatted += '/' + value.substring(4, 8);
                    }
                }
            }
            input.value = formatted;
            let newPos = value.length + Math.floor(value.length / 2);
            input.setSelectionRange(newPos, newPos);
        }

        // ===== НОВА ФУНКЦІЯ: показ/приховування даних авто =====
        function toggleServiceType() {
            const service = document.getElementById('serviceType').value;
            const carSection = document.getElementById('carDataSection');

            if (service === 'Auto') {
                carSection.style.display = 'block';
            } else {
                carSection.style.display = 'none';
                // Очищаємо поля авто
                document.getElementById('carBrand').value = '';
                document.getElementById('carModel').value = '';
                document.getElementById('regNumber').value = '';
            }
            updateRepairName();
        }

        function addItemRow() {
            const tbody = document.getElementById('itemsTbody');
            const row = tbody.insertRow();
            row.innerHTML = `
                <td><input type="text" class="item-name" value="CZĘŚCI" style="width:100%;"></td>
                <td><input type="text" class="item-ref" placeholder="Np. 5/10/2024" style="width:100px;"></td>
                <td><input type="number" class="item-qty" value="1" min="1" style="width:60px;"></td>
                <td><select class="item-unit" style="width:60px;"><option>szt.</option><option>godz.</option><option>kg</option><option>ml</option></select></td>
                <td><input type="number" class="item-price" step="0.01" value="0.00" style="width:80px;"></td>
                <td class="item-total" style="text-align:right;">0.00</td>
                <td><button type="button" onclick="removeItem(this)">Usuń</button></td>
            `;
            const qtyInput = row.querySelector('.item-qty');
            const priceInput = row.querySelector('.item-price');
            const totalCell = row.querySelector('.item-total');
            function updateRowTotal() {
                const qty = parseFloat(qtyInput.value) || 0;
                const price = parseFloat(priceInput.value) || 0;
                totalCell.textContent = (qty * price).toFixed(2);
                updateGrandTotal();
            }
            qtyInput.addEventListener('input', updateRowTotal);
            priceInput.addEventListener('input', updateRowTotal);
            updateRowTotal();
        }

        function removeItem(btn) {
            const rows = document.querySelectorAll('#itemsTbody tr');
            if (rows.length > 1) {
                btn.closest('tr').remove();
                updateGrandTotal();
            } else {
                alert('Nie można usunąć ostatniej pozycji.');
            }
        }

        function updateGrandTotal() {
            let total = 0;
            document.querySelectorAll('.item-total').forEach(cell => {
                total += parseFloat(cell.textContent) || 0;
            });
            document.getElementById('grandTotal').textContent = total.toFixed(2);
        }

        function toggleBuyerType() {
            const type = document.getElementById('buyerType').value;
            const nipGroup = document.getElementById('nipGroup');
            const peselGroup = document.getElementById('peselGroup');
            const buyerManual = document.getElementById('buyerManual');
            if (type === 'firma') {
                nipGroup.style.display = 'block';
                peselGroup.style.display = 'none';
                buyerManual.style.display = 'none';
                document.getElementById('buyerNip').value = '';
                document.getElementById('buyerPesel').value = '';
                document.getElementById('buyerName').value = '';
                document.getElementById('buyerAddress').value = '';
                document.getElementById('buyerZipCity').value = '';
            } else {
                nipGroup.style.display = 'none';
                peselGroup.style.display = 'block';
                buyerManual.style.display = 'block';
                document.getElementById('buyerNip').value = '';
                document.getElementById('buyerPesel').value = '';
            }
            updateDisable();
        }

        const sellerData = {
            nip: "7773451760",
            name: "Auto Max Garage Andrii Shepetiuk",
            address: "ul. Szymańskiego 14",
            zipCity: "62-025 Kostrzyn",
            email: "service198@ukr.net",
            phone: "730349940",
            bank: "Santander Bank Polska S.A.",
            account: "68 1090 1450 0000 0001 6372 2809"
        };

        function loadClientData() {
            if (document.getElementById('buyerType').value !== 'firma') return;
            const nip = document.getElementById('buyerNip').value;
            if (nip.length < 10) return;
            const clients = JSON.parse(localStorage.getItem('clients') || '[]');
            const client = clients.find(c => c.nip === nip);
            if (client) {
                document.getElementById('buyerName').value = client.name;
                document.getElementById('buyerAddress').value = client.address;
                document.getElementById('buyerZipCity').value = client.zipCity;
                document.getElementById('buyerManual').style.display = 'block';
                document.getElementById('status').textContent = 'Dane klienta załadowane z bazy!';
                document.getElementById('status').style.color = 'green';
            } else {
                fetchCompanyData(nip);
            }
        }

        function saveClientData() {
            if (document.getElementById('buyerType').value !== 'firma') return;
            const nip = document.getElementById('buyerNip').value;
            const name = document.getElementById('buyerName').value;
            const address = document.getElementById('buyerAddress').value;
            const zipCity = document.getElementById('buyerZipCity').value;
            if (!nip || !name) {
                alert('Wypełnij NIP i nazwę klienta!');
                return;
            }
            let clients = JSON.parse(localStorage.getItem('clients') || '[]');
            const existing = clients.find(c => c.nip === nip);
            if (existing) {
                existing.name = name;
                existing.address = address;
                existing.zipCity = zipCity;
            } else {
                clients.push({ nip, name, address, zipCity });
            }
            localStorage.setItem('clients', JSON.stringify(clients));
            document.getElementById('status').textContent = 'Klient zapisany do bazy!';
            document.getElementById('status').style.color = 'green';
        }

        async function fetchCompanyData(nip) {
            const status = document.getElementById('status');
            const error = document.getElementById('error');
            status.textContent = 'Pobieram dane z API MF...';
            error.textContent = '';

            try {
                const url = `https://wl-api.mf.gov.pl/api/search/nip/${nip}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Błąd podczas pobierania danych z API');
                const data = await response.json();
                if (data.status === 'OK' && data.result) {
                    const company = data.result;
                    document.getElementById('buyerName').value = company.name;
                    document.getElementById('buyerAddress').value = company.address;
                    document.getElementById('buyerZipCity').value = company.zipCode;
                    document.getElementById('buyerManual').style.display = 'block';
                    status.textContent = '✅ Dane firmy pobrano automatycznie';
                    status.style.color = 'green';
                } else {
                    throw new Error('Firma nie została znaleziona');
                }
            } catch (err) {
                error.textContent = err.message;
                status.textContent = '';
                document.getElementById('buyerManual').style.display = 'block';
                console.error(err);
            }
        }

        function updateDisable() {
            // залишаємо для сумісності
        }

        function numberToWordsPL(amount) {
            const units = ["", "jeden", "dwa", "trzy", "cztery", "pięć", "sześć", "siedem", "osiem", "dziewięć"];
            const teens = ["dziesięć", "jedenaście", "dwanaście", "trzynaście", "czternaście", "piętnaście", "szesnaście", "siedemnaście", "osiemnaście", "dziewiętnaście"];
            const tens = ["", "", "dwadzieścia", "trzydzieści", "czterdzieści", "pięćdziesiąt", "sześćdziesiąt", "siedemdziesiąt", "osiemdziesiąt", "dziewięćdziesiąt"];
            const hundreds = ["", "sto", "dwieście", "trzysta", "czterysta", "pięćset", "sześćset", "siedemset", "osiemset", "dziewięćset"];
            const thousandsForms = ["tysiąc", "tysiące", "tysięcy"];

            function numToWords(n) {
                if (n === 0) return "zero";
                let words = "";
                const h = Math.floor(n / 100);
                const t = Math.floor((n % 100) / 10);
                const u = n % 10;
                if (h > 0) words += hundreds[h] + " ";
                if (t === 1) {
                    words += teens[u] + " ";
                } else {
                    if (t > 1) words += tens[t] + " ";
                    if (u > 0) words += units[u] + " ";
                }
                return words.trim();
            }

            function thousandsForm(n) {
                if (n === 1) return thousandsForms[0];
                if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return thousandsForms[1];
                return thousandsForms[2];
            }

            const zl = Math.floor(amount);
            const gr = Math.round((amount - zl) * 100);
            let result = "";
            const thousands = Math.floor(zl / 1000);
            const rest = zl % 1000;

            if (thousands > 0) result += numToWords(thousands) + " " + thousandsForm(thousands) + " ";
            if (rest > 0) result += numToWords(rest);

            if (zl === 0 && gr === 0) {
                result = "zero złotych";
            } else if (zl === 0 && gr > 0) {
                result = "zero złotych i " + numToWords(gr);
                result += (gr === 1 ? " grosz" : (gr % 10 >= 2 && gr % 10 <= 4 && (gr % 100 < 10 || gr % 100 >= 20) ? " grosze" : " groszy"));
            } else {
                result += (zl === 1 ? " złoty" : (zl % 10 >= 2 && zl % 10 <= 4 && (zl % 100 < 10 || zl % 100 >= 20) ? " złote" : " złotych"));
                if (gr > 0) {
                    result += " i " + numToWords(gr);
                    result += (gr === 1 ? " grosz" : (gr % 10 >= 2 && gr % 10 <= 4 && (gr % 100 < 10 || gr % 100 >= 20) ? " grosze" : " groszy"));
                }
            }
            return result.trim();
        }

        function generateInvoice() {
            const serviceType = document.getElementById('serviceType').value;
            const carBrand = document.getElementById('carBrand').value.trim();
            const carModel = document.getElementById('carModel').value.trim();
            const regNumber = document.getElementById('regNumber').value.trim();
            const paymentType = document.getElementById('paymentType').value;
            const buyerType = document.getElementById('buyerType').value;
            const buyerIdentifier = buyerType === 'firma' ? document.getElementById('buyerNip').value : document.getElementById('buyerPesel').value;
            const buyerName = document.getElementById('buyerName').value || '';
            const buyerAddress = document.getElementById('buyerAddress').value || '';
            const buyerZipCity = document.getElementById('buyerZipCity').value || '';
            const customNumberInput = document.getElementById('customNumber').value.trim();

            // Валідація
            if (!serviceType) {
                alert('Wybierz rodzaj usługi!');
                return;
            }

            if (serviceType === 'Auto') {
                if (!carBrand || !carModel || !regNumber) {
                    alert('Wypełnij dane auta (marka, model, nr rejestracyjny)!');
                    return;
                }
            }

            if (!paymentType || !buyerIdentifier || !buyerName) {
                alert('Wypełnij wszystkie wymagane pola faktury!');
                return;
            }

            const items = [];
            document.querySelectorAll('#itemsTbody tr').forEach((row, index) => {
                const name = row.querySelector('.item-name').value.trim();
                const ref = row.querySelector('.item-ref').value.trim();
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const unit = row.querySelector('.item-unit').value;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                const totalNet = qty * price;
                const fullName = ref ? `${name} (ref. faktura ${ref})` : name;
                if (name && qty > 0 && price > 0) {
                    items.push({lp: index+1, name: fullName, qty, unit, price: price.toFixed(2), totalNet: totalNet.toFixed(2)});
                }
            });

            if (items.length === 0) {
                alert('Dodaj co najmniej jedną pozycję!');
                return;
            }

            const totalNetAmount = items.reduce((sum, item) => sum + parseFloat(item.totalNet), 0);
            const totalAmount = totalNetAmount;

            const buyer = { name: buyerName, address: buyerAddress, zipCity: buyerZipCity, type: buyerType, identifier: buyerIdentifier };
            createInvoice(sellerData, buyer, items, totalAmount, paymentType, customNumberInput);
        }

        function createInvoice(seller, buyer, items, amount, paymentType, customNumberInput) {
            let issueDate;
            const issueDateInput = document.getElementById('issueDate').value;
            if (issueDateInput) {
                issueDate = issueDateInput;
            } else {
                issueDate = new Date().toISOString().split('T')[0];
            }
            const saleDate = issueDate;
            let dueDate;
            if (paymentType === 'Gotówka') {
                dueDate = issueDate;
            } else {
                const issue = new Date(issueDate);
                dueDate = new Date(issue.getTime() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            }

            const today = new Date();
            const month = today.getMonth() + 1;
            const year = today.getFullYear();
            let invoiceNumber;
            const paddedMonth = month.toString().padStart(2, '0');
            if (customNumberInput) {
                if (customNumberInput.includes('/')) {
                    let parts = customNumberInput.split('/');
                    if (parts.length === 3) {
                        let num = parseInt(parts[0].trim()) || 1;
                        let numStr = num.toString().padStart(2, '0');
                        let displayNum = numStr.replace(/^0/, '');
                        let mm = parts[1].trim().padStart(2, '0');
                        let yyyy = parts[2].trim();
                        invoiceNumber = `${displayNum}/${mm}/${yyyy}`;
                    } else {
                        invoiceNumber = customNumberInput;
                    }
                } else {
                    let num = parseInt(customNumberInput.trim()) || 1;
                    let numStr = num.toString().padStart(2, '0');
                    let displayNum = numStr.replace(/^0/, '');
                    invoiceNumber = `${displayNum}/${paddedMonth}/${year}`;
                }
            } else {
                let invoiceCounter = getInvoiceCounter(month, year);
                let num = invoiceCounter;
                let numStr = num.toString().padStart(2, '0');
                let displayNum = numStr.replace(/^0/, '');
                invoiceNumber = `${displayNum}/${paddedMonth}/${year}`;
                invoiceCounter++;
                setInvoiceCounter(invoiceCounter, month, year);
            }

            const netAmount = amount.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const vatAmount = '0,00';
            const grossAmount = netAmount;
            const effectivePaid = (paymentType === 'Gotówka');
            const dueAmountWords = numberToWordsPL(amount);
            const dueAmount = effectivePaid ? '0,00' : netAmount;

            const buyerIdentifierLabel = buyer.type === 'firma' ? 'NIP' : 'PESEL';

            let statusText = '';
            if (paymentType === 'Gotówka') {
                statusText = `<p style="text-align: center; font-weight: bold; color: green; margin-top: 10px;">Faktura opłacona</p>`;
            }

            let signatureSection = '';
            if (paymentType === 'Przelew') {
                signatureSection = `
                    <div style="display: flex; justify-content: space-between; margin-top: 50px;">
                        <div style="width: 48%; text-align: center;">
                            <small style="font-size: 8px;">Osoba upoważniona do wystawienia</small>
                            <div class="signature-line"></div>
                        </div>
                        <div style="width: 48%; text-align: center;">
                            <small style="font-size: 8px;">Osoba upoważniona do odbioru</small>
                            <div class="signature-line"></div>
                        </div>
                    </div>
                `;
            }

            let tableRows = '';
            items.forEach(item => {
                const priceStr = parseFloat(item.price).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const totalStr = parseFloat(item.totalNet).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                tableRows += `
                    <tr>
                        <td style="border: 1px solid black; padding: 2px;">${item.lp}</td>
                        <td style="border: 1px solid black; padding: 2px;">${item.name}</td>
                        <td style="border: 1px solid black; padding: 2px;">${item.qty} ${item.unit}</td>
                        <td style="border: 1px solid black; padding: 2px; text-align: right;">${priceStr}</td>
                        <td style="border: 1px solid black; padding: 2px; text-align: right;">${totalStr}</td>
                        <td style="border: 1px solid black; padding: 2px; text-align: right;">zw</td>
                        <td style="border: 1px solid black; padding: 2px; text-align: right;">0,00</td>
                        <td style="border: 1px solid black; padding: 2px; text-align: right;">${totalStr}</td>
                    </tr>
                `;
            });

            const invoiceHtml = `
                <div style="width: 190mm; padding: 10mm 10mm 10mm 4mm; font-family: Arial, sans-serif; line-height: 1.2; font-size: 9px; position: relative;">
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 10px;">
                        <tr>
                            <td style="width: 40%; vertical-align: top; text-align: left;">
                                <div style="background: black; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 18px; display: inline-block; width: 70mm;">
                                    Auto Max Garage<br>
                                    ${invoiceNumber}
                                </div>
                            </td>
                            <td style="width: 60%; vertical-align: top; text-align: center;">
                                <h3 style="margin: 0; font-size: 20px;">Faktura numer ${invoiceNumber}</h3>
                            </td>
                        </tr>
                    </table>
                    <p style="margin: 5px 0;">Miejsce wystawienia: Kostrzyn</p>
                    <p style="margin: 5px 0;">Data wystawienia: <span class="bold-text">${issueDate}</span></p>
                    <p style="margin: 5px 0;">Data sprzedaży: <span class="bold-text">${saleDate}</span></p>
                    <p style="margin: 5px 0;">Termin płatności do: <span class="bold-text">${dueDate}</span></p>
                    <p style="margin: 5px 0;">Płatność: ${paymentType}</p>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                        <tr>
                            <td style="width: 50%; vertical-align: top; padding-right: 10px;">
                                <strong>Sprzedawca</strong><br>
                                <span class="bold-text">${seller.name}</span><br>
                                ${seller.address}<br>
                                ${seller.zipCity}<br>
                                NIP: ${seller.nip}<br>
                                E-mail: ${seller.email}<br>
                                Tel: ${seller.phone}
                            </td>
                            <td style="width: 50%; vertical-align: top;">
                                <strong>Nabywca</strong><br>
                                <span class="bold-text">${buyer.name}</span><br>
                                ${buyer.address}<br>
                                ${buyer.zipCity}<br>
                                ${buyerIdentifierLabel}: ${buyer.identifier}
                            </td>
                        </tr>
                    </table>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                        <thead>
                            <tr style="background: #f0f0f0;">
                                <th style="border: 1px solid black; padding: 2px;">Lp</th>
                                <th style="border: 1px solid black; padding: 2px;">Nazwa towaru lub usługi</th>
                                <th style="border: 1px solid black; padding: 2px;">Jm</th>
                                <th style="border: 1px solid black; padding: 2px;">Cena netto</th>
                                <th style="border: 1px solid black; padding: 2px;">Wart. netto</th>
                                <th style="border: 1px solid black; padding: 2px;">VAT %</th>
                                <th style="border: 1px solid black; padding: 2px;">Wart. VAT</th>
                                <th style="border: 1px solid black; padding: 2px;">Wart. brutto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                            <tr style="font-weight: bold;">
                                <td colspan="4" style="border: 1px solid black; padding: 2px; text-align: right;">Razem:</td>
                                <td style="border: 1px solid black; padding: 2px; text-align: right;">${netAmount} PLN</td>
                                <td style="border: 1px solid black; padding: 2px;"></td>
                                <td style="border: 1px solid black; padding: 2px; text-align: right;">${vatAmount} PLN</td>
                                <td style="border: 1px solid black; padding: 2px; text-align: right;">${grossAmount} PLN</td>
                            </tr>
                        </tbody>
                    </table>
                    <table class="summary-table" style="width: 100%; border-collapse: collapse; margin-top: 20px; border: none;">
                        <tr>
                            <td style="width: 50%; vertical-align: top;">
                                <p>Podstawa zwolnienia z VAT:<br>Zwolnienie podmiotowe z VAT art. 113 ust. 1 ustawy o VAT</p>
                                <p>Forma zapłaty: <span class="bold-text">${paymentType}</span></p>
                                ${paymentType === 'Przelew' ? `<p>Bank: <span class="bold-text">${seller.bank}</span></p><p>Nr konta: <span class="bold-text">${seller.account}</span></p>` : ''}
                            </td>
                            <td style="width: 50%; vertical-align: top; text-align: right;">
                                <table style="width: 100%; border-collapse: collapse; border: none;">
                                    <tr><td style="text-align: left; padding: 0;">Wartość netto</td><td style="text-align: right; padding: 0;"><span class="bold-text">${netAmount} PLN</span></td></tr>
                                    <tr><td style="text-align: left; padding: 0;">Wartość VAT</td><td style="text-align: right; padding: 0;"><span class="bold-text">${vatAmount} PLN</span></td></tr>
                                    <tr><td style="text-align: left; padding: 0;">Wartość brutto</td><td style="text-align: right; padding: 0;"><span class="bold-text">${grossAmount} PLN</span></td></tr>
                                    <tr><td style="text-align: left; padding: 0;">Słownie:</td><td style="text-align: right; padding: 0;"><span class="bold-text">${dueAmountWords}</span></td></tr>
                                    <tr><td style="text-align: left; padding: 0;">Do zapłaty:</td><td style="text-align: right; padding: 0;"><span class="bold-text">${dueAmount} PLN</span></td></tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                    ${statusText}
                    ${signatureSection}
                </div>
            `;

            const preview = document.getElementById('invoicePreview');
            preview.innerHTML = invoiceHtml;
            preview.style.display = 'block';

            html2canvas(preview, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`faktura_${invoiceNumber}.pdf`);
            });
        }

        // ===== ОНОВЛЕННЯ НАЗВИ ПОЗИЦІЇ =====
        function updateRepairName() {
            const service = document.getElementById('serviceType').value;
            const brand = document.getElementById('carBrand').value.trim();
            const model = document.getElementById('carModel').value.trim();
            const reg = document.getElementById('regNumber').value.trim().toUpperCase();
            const firstRow = document.querySelector('#itemsTbody tr');
            if (!firstRow) return;

            let name = '';

            if (service === 'Auto') {
                name = 'NAPRAWA POJAZDU';
                if (brand) name += ' ' + brand;
                if (model) name += ' ' + model;
                if (reg) name += ' NR REJESTRACYJNY ' + reg;
            } else if (service) {
                name = service.toUpperCase();
            }

            firstRow.querySelector('.item-name').value = name;
        }

        // Initialize on load
        window.addEventListener('load', function() {
            const initialRow = document.querySelector('#itemsTbody tr');
            const initialQty = initialRow.querySelector('.item-qty');
            const initialPrice = initialRow.querySelector('.item-price');
            const initialTotal = initialRow.querySelector('.item-total');

            function updateInitialTotal() {
                const qty = parseFloat(initialQty.value) || 0;
                const price = parseFloat(initialPrice.value) || 0;
                initialTotal.textContent = (qty * price).toFixed(2);
                updateGrandTotal();
            }
            initialQty.addEventListener('input', updateInitialTotal);
            initialPrice.addEventListener('input', updateInitialTotal);
            updateInitialTotal();

            // Слухачі для полів авто
            document.getElementById('carBrand').addEventListener('input', updateRepairName);
            document.getElementById('carModel').addEventListener('input', updateRepairName);
            document.getElementById('regNumber').addEventListener('input', updateRepairName);

            updateDisable();
        });
    </script>
</body>
</html>
